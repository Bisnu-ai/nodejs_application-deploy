name: Build, Push and Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Docker Hub Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build & Push on GitHub Actions (Server ka load bacha liya)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest

      # Step 4: Server par login karke sirf bani-banayi image Pull aur Run karna
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Latest image ko Docker Hub se server par download (pull) karein
            docker pull ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest
            
            # 2. Project folder mein jayein (Jahan docker-compose.yml rakhi hai)
            cd /home/ubuntu/nodejs_application-deploy
            
            # 3. Purane container ko rokein aur naya start karein (BINA build kiye)
            docker compose down
            docker compose up -d

      # Step 5: Success mail
      - name: Send email on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME  }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Deployment Successful, Which is devloped by Bisnu - ${{ github.repository }}"
          to: sambunu2003@gmail.com
          from: GitHub Actions
          body: |
            Deployment successful!
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

      # Step 6: Failure mail
      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Deployment Failed, Which is devloped by Bisnu  - ${{ github.repository }}"
          to: sambunu2003@gmail.com
          from: GitHub Actions
          body: |
            Deployment failed!
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}